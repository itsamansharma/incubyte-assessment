services:
  - type: web
    name: acme-payroll-api
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: bundle install
    startCommand: bundle exec rails db:prepare && bundle exec rails db:seed && bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: acme-payroll-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          name: acme-payroll-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: acme-payroll-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: RAILS_API_URL
        fromService:
          name: acme-payroll-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_RAILS_API_URL
        fromService:
          name: acme-payroll-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: acme-payroll-db
    databaseName: acme_payroll_production
    user: acme_payroll
    plan: free
    region: singapore
    postgresMajorVersion: 18
    ipAllowList: []
